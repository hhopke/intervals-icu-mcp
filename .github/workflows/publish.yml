name: Publish Release

# Releases are cut on demand: Actions → Publish Release → Run workflow (on main).
# The version is derived from the PR titles merged since the last tag
# (.github/scripts/next_version.py), and the release notes are GitHub's generated
# notes, i.e. the list of merged PR titles. A release created by hand in the GitHub UI
# still publishes through the `release` trigger.
#
# Everything runs in this one workflow on purpose: a release created with GITHUB_TOKEN
# does not trigger other workflows, and PyPI trusted publishing is bound to this file.
#
# If `pypi` or `mcp-registry` fails after the tag and Release exist, don't dispatch again
# (it would report "Nothing to release", since there are no commits past the new tag).
# Re-run the failed jobs of the same run instead: they reuse the tag, and `pypi` has
# `skip-existing: true`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z). Leave empty to derive it from PR titles.'
        required: false
        default: ''
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Cheap checks first, so a bad dispatch fails in seconds instead of after the
  # full test matrix.
  preflight:
    name: Preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main, not ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The MCP Registry rejects descriptions over 100 chars, and only after PyPI has
      # published, leaving a partial release. Fail before anything is tagged.
      - name: Check server.json description length
        run: |
          LEN=$(jq -r '.description | length' server.json)
          if [ "$LEN" -gt 100 ]; then
            echo "::error::server.json description is $LEN chars; the MCP Registry allows 100."
            exit 1
          fi

      - name: Compute next version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: python3 .github/scripts/next_version.py --version "$VERSION_OVERRIDE"

  test:
    name: Run Tests
    needs: preflight
    uses: ./.github/workflows/test.yml

  cut-release:
    name: Tag and create GitHub Release
    needs: [preflight, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_TAG"

  pypi:
    needs: cut-release
    if: >-
      !cancelled() &&
      (github.event_name == 'release' || needs.cut-release.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut-release.outputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    needs: [cut-release, pypi]
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ needs.cut-release.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Sync server.json version to release tag
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo modelcontextprotocol/registry \
            --pattern 'mcp-publisher_linux_amd64.tar.gz'
          tar xzf mcp-publisher_linux_amd64.tar.gz
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
